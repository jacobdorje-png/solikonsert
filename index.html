<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Solikonsert</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f2f8fa;--surface:#fff;--surface-soft:#e9f4f6;
  --ink:#2f3a3d;--muted:#7e8f94;
  --border:rgba(47,58,61,0.10);--border-strong:rgba(47,58,61,0.18);
  --accent:#4fa3ac;--accent-dark:#357c85;--accent-light:#dcf0f1;
  --secondary:#8fbf7a;--secondary-dark:#5f8e4d;--secondary-light:#e6f4de;
  --danger:#e0644f;--success:#5f9d54;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f2f8fa,#e4f2ec);padding:1.5rem;}
.login-box{background:#fff;border:1px solid var(--border);box-shadow:0 10px 40px rgba(47,58,61,0.08);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center;}
.login-brand{font-family:'Cormorant Garamond',serif;font-size:44px;color:var(--accent-dark);margin-bottom:4px;}
.login-sub{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem;}
#pw-input{width:100%;padding:16px;background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;font-size:18px;color:var(--ink);outline:none;text-align:center;letter-spacing:0.1em;margin-bottom:1rem;font-family:'DM Sans',sans-serif;}
#pw-input::placeholder{color:rgba(47,58,61,0.3);letter-spacing:normal;font-size:15px;}
#pw-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.login-error{font-size:13px;color:var(--danger);margin-top:0.75rem;min-height:20px;}
#app{display:none;}
header{background:var(--accent);padding:1.25rem 1.25rem 1rem;display:flex;align-items:center;justify-content:space-between;}
.brand-wrap{display:flex;flex-direction:column;}
.brand-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.75);}
.brand-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:#fff;line-height:1;}
.header-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;line-height:1;}
.stat-lbl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.65);}
.live-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,0.6);}
.live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,174,96,0.4);}70%{box-shadow:0 0 0 6px rgba(39,174,96,0);}100%{box-shadow:0 0 0 0 rgba(39,174,96,0);}}

.main-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:11;}
.main-tabs .tab{flex:1;text-align:center;padding:13px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;user-select:none;}
.main-tabs .tab.active{color:var(--accent-dark);border-bottom-color:var(--accent);}

.konsert-section{padding:1rem 1rem 0;}
.konsert-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem;}
.konsert-section-title{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--accent-dark);margin:0;}
.konsert-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.konsert-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;}
.konsert-strip .konsert-card{flex:0 0 230px;}
.konsert-list-page .konsert-card{margin-bottom:0.7rem;}
.konsert-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.konsert-navn{font-size:16px;font-weight:500;}
.konsert-dato{font-size:13px;color:var(--muted);margin-top:3px;}
.konsert-empty{color:var(--muted);font-size:14px;padding:0.25rem 0 0.5rem;}
.konsert-stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.kd-stat{font-size:11px;padding:3px 7px;border-radius:10px;background:var(--surface-soft);color:var(--muted);white-space:nowrap;}
.kd-stat.s-invitert{background:var(--accent-light);color:var(--accent-dark);}
.kd-stat.s-kom{background:var(--secondary-light);color:var(--secondary-dark);}
.kd-stat.s-kunne_ikke{background:rgba(224,100,79,0.15);color:var(--danger);}
.kd-stat.s-ikke_svart{background:rgba(126,143,148,0.15);color:var(--muted);}
.kd-stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem;}

.searchbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0.75rem 1rem;display:flex;gap:0.5rem;align-items:center;margin-top:1rem;}
.search-wrap{flex:1;position:relative;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:0.3;pointer-events:none;}
.search-wrap input{width:100%;padding:11px 11px 11px 36px;border:1px solid var(--border-strong);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;background:var(--bg);color:var(--ink);outline:none;-webkit-appearance:none;}
.search-wrap input:focus{border-color:var(--accent);}
.btn-sm{padding:10px 13px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}

.sms-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0.6rem 1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sms-bar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;}
.sms-count{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;}
.btn-primary-sm{padding:8px 14px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-auto-sms{padding:8px 14px;border-radius:8px;background:var(--secondary-dark);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-auto-sms:disabled{opacity:0.6;cursor:default;}
.sms-check{width:20px;height:20px;flex-shrink:0;cursor:pointer;margin-right:2px;}
.sms-konsert-select{padding:9px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);max-width:220px;}

.sms-queue-progress{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem;}
.sms-queue-guest{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1rem;text-align:center;margin-bottom:1rem;}
.sms-queue-name{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--ink);margin-bottom:6px;}
.sms-queue-phone{font-size:19px;font-weight:500;color:var(--accent-dark);margin-bottom:6px;}
.sms-queue-note{font-size:13px;color:var(--muted);font-style:italic;}
.sms-mark-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0.4rem 0.1rem;}
.sms-done{text-align:center;padding:2rem 1rem;}
.sms-done-icon{font-family:'Cormorant Garamond',serif;font-size:44px;color:var(--secondary-dark);margin-bottom:0.5rem;}

.cards{padding:0.75rem 1rem 6rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:0.7rem;overflow:hidden;}
.card-top{display:flex;align-items:center;gap:10px;padding:13px 14px 6px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-light);border:1px solid rgba(79,163,172,0.3);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;color:var(--accent-dark);flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:17px;font-weight:500;}
.card-phone{margin-top:3px;}
.card-phone a{font-size:19px;font-weight:500;color:var(--accent-dark);text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.card-btns{display:flex;gap:4px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:none;background:rgba(0,0,0,0.05);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.card-note{padding:2px 14px 10px;font-size:13px;color:var(--muted);cursor:pointer;line-height:1.4;}
.card-note.empty-txt{color:#bbb;font-style:italic;}
.card-note textarea{width:100%;padding:8px 10px;border:1.5px solid var(--accent);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface);color:var(--ink);outline:none;resize:vertical;min-height:60px;}
.card-badges{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px;}
.kbadge{display:inline-flex;font-size:11px;padding:4px 8px;border-radius:10px;background:var(--surface-soft);color:var(--muted);}
.kbadge.s-invitert{background:var(--accent-light);color:var(--accent-dark);}
.kbadge.s-kom{background:var(--secondary-light);color:var(--secondary-dark);}
.kbadge.s-kunne_ikke{background:rgba(224,100,79,0.15);color:var(--danger);}
.kbadge.s-ikke_svart{background:rgba(126,143,148,0.15);color:var(--muted);}
.kbadge.more{background:transparent;color:var(--muted);font-style:italic;}
.card-checks{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 13px;border-top:1px solid var(--border);}
.cpill{display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;cursor:pointer;user-select:none;}

.empty-state{text-align:center;padding:3.5rem 2rem;color:var(--muted);}
.empty-icon{font-family:'Cormorant Garamond',serif;font-size:48px;color:rgba(79,163,172,0.3);margin-bottom:0.75rem;}
.empty-state h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--ink);margin-bottom:0.4rem;}
.empty-state p{font-size:14px;}

.konsert-list{padding:1.25rem 1rem 6rem;}
.konsert-list .konsert-card{margin-bottom:0.7rem;}

.attendance-row-wrap{border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.attendance-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}
.attendance-row-head .an{font-size:14px;font-weight:500;}
.attendance-row-head .ad{font-size:12px;color:var(--muted);white-space:nowrap;}
.status-group{display:flex;gap:6px;flex-wrap:wrap;}
.status-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink);font-family:'DM Sans',sans-serif;}
.status-btn.active.s-invitert{background:var(--accent);color:#fff;border-color:var(--accent);}
.status-btn.active.s-kom{background:var(--secondary-dark);color:#fff;border-color:var(--secondary-dark);}
.status-btn.active.s-kunne_ikke{background:var(--danger);color:#fff;border-color:var(--danger);}
.status-btn.active.s-ikke_svart{background:var(--muted);color:#fff;border-color:var(--muted);}
.status-btn.clear{color:var(--danger);border-color:transparent;background:transparent;padding:6px 8px;}

.fab{position:fixed;right:1.25rem;bottom:1.25rem;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;box-shadow:0 4px 14px rgba(47,58,61,0.2);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;}

.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;align-items:flex-end;justify-content:center;}
.sheet-bg.open{display:flex;}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:1.5rem 1.25rem 2.5rem;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;}
.sheet-handle{width:40px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 1.25rem;}
.sheet-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;margin-bottom:1.25rem;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.field label{font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.field input,.field textarea{padding:13px 12px;border:1px solid var(--border-strong);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;background:var(--bg);color:var(--ink);outline:none;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:70px;}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1rem;}
.sheet-btn{padding:14px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);text-align:center;}
.sheet-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent-dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:100;transition:transform 0.25s;max-width:88vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Desktop table */
.desktop-table{display:none;}
@media(min-width:860px){
  .cards{display:none;}
  .desktop-table{display:block;padding:1rem 2.5rem 3rem;}
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
  thead th{text-align:left;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface-soft);}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .name-cell{display:flex;align-items:center;gap:10px;}
  .phone-link{color:var(--accent-dark);text-decoration:none;font-weight:500;}
  .muted{color:var(--muted);}
  .kj{cursor:pointer;max-width:320px;}
  .cc{text-align:center;}
  .cb{width:18px;height:18px;cursor:pointer;}
  .row-acts{display:flex;gap:4px;}
  .icon-btn-sm{width:28px;height:28px;border-radius:7px;border:none;background:rgba(0,0,0,0.05);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);}
  .icon-btn-sm.del svg{stroke:#c0392b;}
  .searchbar{padding-left:2.5rem;padding-right:2.5rem;}
  header{padding-left:2.5rem;padding-right:2.5rem;}
  .fab{right:2.5rem;bottom:2.5rem;}
  .konsert-list{padding:1.5rem 2.5rem 3rem;max-width:860px;}
  .konsert-section{padding-left:2.5rem;padding-right:2.5rem;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">Solikonsert</div>
    <div class="login-sub">Soli Brug · Smia</div>
    <input type="password" id="pw-input" placeholder="Passord" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Logg inn</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand-wrap">
      <div class="brand-label">Soli Brug · Smia</div>
      <div class="brand-title">Solikonsert</div>
    </div>
    <div class="header-meta">
      <div class="stat-num" id="total-count">0</div>
      <div class="stat-lbl">Gjester</div>
      <div class="live-badge"><div class="live-dot"></div>Live</div>
    </div>
  </header>

  <div class="main-tabs">
    <div class="tab active" id="tab-oversikt" onclick="switchView('oversikt')">Oversikt</div>
    <div class="tab" id="tab-arkiv" onclick="switchView('arkiv')">Arkiv</div>
  </div>

  <div id="view-oversikt">
    <div class="konsert-section">
      <div class="konsert-section-head">
        <div class="konsert-section-title">Konserter</div>
        <button class="btn-sm" onclick="openAddKonsert()">+ Ny konsert</button>
      </div>
      <div class="konsert-strip" id="konsert-list"></div>
    </div>

    <div class="searchbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Søk navn eller telefon…" oninput="render()">
      </div>
    </div>

    <div class="sms-bar">
      <button class="btn-sm" id="sms-toggle-btn" onclick="toggleSmsMode()">✉️ Send SMS</button>
      <button class="btn-sm" onclick="openSmsTextSheet()">✏️ Meldingstekst</button>
      <div class="sms-bar-actions" id="sms-bar-actions" style="display:none">
        <select class="sms-konsert-select" id="sms-konsert-select"></select>
        <span class="sms-count" id="sms-count">0 valgt</span>
        <button class="btn-reset" onclick="selectAllVisible()">Velg alle synlige</button>
        <button class="btn-reset" onclick="clearSmsSelection()">Tøm</button>
        <button class="btn-primary-sm" onclick="startSmsQueue()">Start utsending →</button>
        <button class="btn-auto-sms" id="sms-auto-btn" onclick="sendAutoSms()">⚡ Send automatisk</button>
      </div>
    </div>

    <div class="cards" id="cards"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">♪</div>
      <h3>Ingen gjester funnet</h3>
      <p>Prøv et annet søk, eller legg til en ny gjest.</p>
    </div>

    <div class="desktop-table">
      <table>
        <thead>
          <tr>
            <th id="th-sms-check" style="display:none">Vgl</th>
            <th>Navn</th><th>Etternavn</th><th>Telefon</th><th>Notat</th>
            <th>Konserter</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="view-arkiv" style="display:none">
    <div class="konsert-list konsert-list-page" id="arkiv-list"></div>
  </div>

  <button class="fab" id="fab-gjester" onclick="openAdd()" title="Legg til gjest">+</button>
</div>

<div class="sheet-bg" id="edit-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">Legg til gjest</div>
    <div class="form-row">
      <div class="field"><label>Fornavn</label><input id="f-fornavn" placeholder="Fornavn"></div>
      <div class="field"><label>Etternavn</label><input id="f-etternavn" placeholder="Etternavn"></div>
    </div>
    <div class="field"><label>Telefon</label><input id="f-phone" placeholder="9XXXXXXX" inputmode="tel"></div>
    <div class="field"><label>Notat</label><textarea id="f-notater" placeholder="Valgfritt notat…"></textarea></div>
    <div class="sheet-actions">
      <button class="sheet-btn" onclick="closeSheet()">Avbryt</button>
      <button class="sheet-btn primary" onclick="saveGuest()">Lagre</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="konsert-edit-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="konsert-edit-title">Legg til konsert</div>
    <div class="field"><label>Navn</label><input id="k-navn" placeholder="F.eks. Vårkonsert 2026"></div>
    <div class="field"><label>Dato</label><input id="k-dato" type="date"></div>
    <div class="sheet-actions" id="konsert-edit-actions">
      <button class="sheet-btn" onclick="closeKonsertEditSheet()">Avbryt</button>
      <button class="sheet-btn primary" onclick="saveKonsert()">Lagre</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="attendance-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="attendance-title">Konserter</div>
    <div id="attendance-list"></div>
    <div class="sheet-actions" style="grid-template-columns:1fr;margin-top:0.5rem;">
      <button class="sheet-btn primary" onclick="closeAttendanceSheet()">Lukk</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="konsert-detail-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>

<script>

function tryLogin(){

function switchView(v){
  currentView=v;

}

async function loadGuests(){
  const scrollY=window.scrollY;
  const PAGE=1000;
  let all=[],from=0,keepGoing=true,hadError=false;
  while(keepGoing){
    const{data,error}=await sb.from(TABLE).select('*').order('etternavn',{ascending:true}).range(from,from+PAGE-1);
    if(error){hadError=true;break;}
    all=all.concat(data||[]);
    if(!data||data.length<PAGE){keepGoing=false;}else{from+=PAGE;}
  }
  if(!hadError){guests=all;render();window.scrollTo({top:scrollY});}
}
async function loadConcerts(){
  const{data,error}=await sb.from(KONSERT_TABLE).select('*').order('created_at',{ascending:false});
  if(!error){
    concerts=data||[];
    renderKonserter();
    render();
    if(currentView==='arkiv')renderArkiv();
    const barOpen=document.getElementById('sms-bar-actions');
    if(barOpen&&barOpen.style.display!=='none')populateKonsertSelect();
  }
}
async function loadAttendance(){
  const PAGE=1000;let all=[],from=0,keepGoing=true;
  while(keepGoing){
    const{data,error}=await sb.from(DELTAKELSE_TABLE).select('*').range(from,from+PAGE-1);
    if(error)break;
    all=all.concat(data||[]);
    if(!data||data.length<PAGE)keepGoing=false;else from+=PAGE;
  }
  attendance=all;
  render();renderKonserter();
  if(currentView==='arkiv')renderArkiv();
}
async function loadSettings(){
  const{data,error}=await sb.from(SETTINGS_TABLE).select('*').eq('id',1).maybeSingle();
  if(!error&&data)appSettings=data;
}
function attendanceByGuestMap(){
  const m=new Map();
  for(const a of attendance){
    if(!m.has(a.gjest_id))m.set(a.gjest_id,[]);
    m.get(a.gjest_id).push(a);
  }
  return m;
}
function statusMapForKonsert(kid){
  const m=new Map();
  for(const a of attendance){
    if(a.konsert_id===kid)m.set(a.gjest_id,a.status);
  }
  return m;
}
function attendedIds(gid,byGuestMap){
  const rows=byGuestMap?(byGuestMap.get(gid)||[]):attendance.filter(a=>a.gjest_id===gid);
  return rows.map(a=>a.konsert_id);
}
function statusFor(gid,kid){const a=attendance.find(x=>x.gjest_id===gid&&x.konsert_id===kid);return a?a.status:null;}
function statusCounts(kid){
  const c={invitert:0,kom:0,kunne_ikke:0,ikke_svart:0};
  attendance.filter(a=>a.konsert_id===kid).forEach(a=>{if(c[a.status]!==undefined)c[a.status]++;});
  return c;
}
function activeConcertsSorted(){
  return concerts.filter(k=>!k.arkivert).slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
}
function archivedConcertsSorted(){
  return concerts.filter(k=>k.arkivert).slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
}

function subscribeRealtime(){
  sb.channel('konsert_all')
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE},()=>loadGuests())
    .on('postgres_changes',{event:'*',schema:'public',table:KONSERT_TABLE},()=>loadConcerts())
    .on('postgres_changes',{event:'*',schema:'public',table:DELTAKELSE_TABLE},async()=>{
      await loadAttendance();render();renderKonserter();
      if(currentView==='arkiv')renderArkiv();
      if(document.getElementById('attendance-sheet').classList.contains('open'))renderAttendanceList();
      if(document.getElementById('konsert-detail-sheet').classList.contains('open')){renderKonsertDetailStats();renderKonsertDetailList();}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:SETTINGS_TABLE},()=>loadSettings())
    .subscribe();
}

function smsHref(phone){
  return `sms:${encodeURIComponent(phone)}?&body=${encodeURIComponent(appSettings.sms_tekst||'')}`;
}

function getFilteredGuests(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let list=guests;
  if(q)list=list.filter(g=>(g.fornavn||'').toLowerCase().includes(q)||(g.etternavn||'').toLowerCase().includes(q)||(g.phone||'').toLowerCase().includes(q)||(g.notater||'').toLowerCase().includes(q));
  return list;
}

function guestBadges(gid,byGuestMap){
  const rows=byGuestMap?(byGuestMap.get(gid)||[]):attendance.filter(a=>a.gjest_id===gid);
  if(!rows.length)return'';
  const withConcert=rows.map(a=>({...a,k:concerts.find(c=>c.id===a.konsert_id)})).filter(x=>x.k);
  withConcert.sort((a,b)=>new Date(b.k.created_at||0)-new Date(a.k.created_at||0));
  const shown=withConcert.slice(0,2);
  const rest=withConcert.length-shown.length;
  return shown.map(x=>`<span class="kbadge s-${x.status}">${esc(x.k.navn)} · ${STATUS_META[x.status]?STATUS_META[x.status].short:x.status}</span>`).join('')+(rest>0?`<span class="kbadge more">+${rest}</span>`:'');
}

function render(){
  const list=getFilteredGuests();
  const byGuest=attendanceByGuestMap();

  document.getElementById('total-count').textContent=guests.length;
  const emptyEl=document.getElementById('empty-state');
  const cardsEl=document.getElementById('cards');
  if(!list.length){cardsEl.innerHTML='';emptyEl.style.display='block';}
  else{
    emptyEl.style.display='none';
    cardsEl.innerHTML=list.map(g=>{
      return `<div class="card" id="card-${g.id}">
        <div class="card-top">
          ${smsMode?`<input type="checkbox" class="sms-check" ${smsSelected.has(g.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleSmsSelect('${g.id}',this.checked)">`:''}
          <div class="avatar">${ini(g.fornavn,g.etternavn)}</div>
          <div class="card-info">
            <div class="card-name">${esc(g.fornavn||'')} ${esc(g.etternavn||'')}</div>
            <div class="card-phone">${g.phone?`<a href="${smsHref(g.phone)}">📱 ${esc(g.phone)}</a>`:''}</div>
          </div>
          <div class="card-btns">
            <button class="icon-btn" onclick="startEdit('${g.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="icon-btn" onclick="deleteGuest('${g.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
          </div>
        </div>
        <div class="card-note ${g.notater?'':'empty-txt'}" id="nt-${g.id}" onclick="editNote('${g.id}')">${esc(g.notater||'Trykk for å legge inn notat…')}</div>
        <div class="card-badges">${guestBadges(g.id,byGuest)}</div>
        <div class="card-checks">
          <div class="cpill" onclick="openAttendanceSheet('${g.id}')">🎵 Konserter (${attendedIds(g.id,byGuest).length})</div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('tbody').innerHTML=list.map(g=>{
    return `<tr>
      ${smsMode?`<td class="cc"><input type="checkbox" class="cb" ${smsSelected.has(g.id)?'checked':''} onchange="toggleSmsSelect('${g.id}',this.checked)"></td>`:''}
      <td><div class="name-cell"><div class="avatar">${ini(g.fornavn,g.etternavn)}</div>${esc(g.fornavn||'')}</div></td>
      <td class="muted">${esc(g.etternavn||'—')}</td>
      <td>${g.phone?`<a class="phone-link" href="${smsHref(g.phone)}">${esc(g.phone)}</a>`:'<span class="muted">—</span>'}</td>
      <td class="kj" onclick="startEdit('${g.id}')">${esc(g.notater||'—')}</td>
      <td class="kj" onclick="openAttendanceSheet('${g.id}')">${guestBadges(g.id,byGuest)||'<span class="muted">—</span>'}</td>
      <td><div class="row-acts">
        <button class="icon-btn-sm" onclick="startEdit('${g.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="icon-btn-sm del" onclick="deleteGuest('${g.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      </div></td>
    </tr>`;
  }).join('');
}
function ini(f,e){return((f||' ')[0]+(e||' ')[0]).toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d)return'';const p=d.split('-');return p.length===3?`${p[2]}.${p[1]}`:d;}
function fmtDateLong(d){
  if(!d)return'';
  const months=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
  const p=d.split('-');if(p.length!==3)return d;
  return `${parseInt(p[2],10)}. ${months[parseInt(p[1],10)-1]} ${p[0]}`;
}

async function editNote(id){
  const el=document.getElementById('nt-'+id);if(!el||el.querySelector('textarea'))return;
  const g=guests.find(x=>x.id===id);const orig=g?g.notater||'':'';
  el.classList.remove('empty-txt');
  el.innerHTML=`<textarea>${esc(orig)}</textarea>`;
  const ta=el.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  ta.onblur=async()=>{
    const val=ta.value.trim();
    if(g)g.notater=val;
    await sb.from(TABLE).update({notater:val}).eq('id',id);
    render();
  };
}

async function deleteGuest(id){
  const g=guests.find(x=>x.id===id);
  if(!confirm(`Slette ${g?g.fornavn+' '+(g.etternavn||''):'denne gjesten'}?`))return;
  await sb.from(TABLE).delete().eq('id',id);
  toast('Slettet');await loadGuests();
}

function openAdd(){
  editId=null;
  document.getElementById('sheet-title').textContent='Legg til gjest';
  document.getElementById('f-fornavn').value='';

  document.getElementById('f-phone').value='';
  document.getElementById('f-notater').value='';
  document.getElementById('edit-sheet').classList.add('open');
}
function startEdit(id){
  const g=guests.find(x=>x.id===id);if(!g)return;
  editId=id;
  document.getElementById('sheet-title').textContent='Rediger gjest';
  document.getElementById('f-fornavn').value=g.fornavn||'';
  document.getElementById('f-etternavn').value=g.etternavn||'';
  document.getElementById('f-phone').value=g.phone||'';
  document.getElementById('f-notater').value=g.notater||'';
  document.getElementById('edit-sheet').classList.add('open');
}
function closeSheet(){document.getElementById('edit-sheet').classList.remove('open');}
async function saveGuest(){
  const fornavn=document.getElementById('f-fornavn').value.trim();
  const etternavn=document.getElementById('f-etternavn').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const notater=document.getElementById('f-notater').value.trim();
  if(!fornavn){toast('Fornavn må fylles ut');return;}
  let error;
  if(editId){
    ({error}=await sb.from(TABLE).update({fornavn,etternavn,phone,notater}).eq('id',editId));
  }else{
    ({error}=await sb.from(TABLE).insert({fornavn,etternavn,phone,notater}));
  }
  if(error){toast('Kunne ikke lagre: '+error.message);return;}
  toast(editId?'Lagret':'Gjest lagt til');
  closeSheet();await loadGuests();
}

async function setStatus(gid,kid,status){
  if(!status){
    const{error}=await sb.from(DELTAKELSE_TABLE).delete().eq('gjest_id',gid).eq('konsert_id',kid);
    if(error){toast('Kunne ikke lagre: '+error.message);return false;}
    attendance=attendance.filter(a=>!(a.gjest_id===gid&&a.konsert_id===kid));
  }else{
    const{error}=await sb.from(DELTAKELSE_TABLE).upsert({gjest_id:gid,konsert_id:kid,status},{onConflict:'gjest_id,konsert_id'});
    if(error){toast('Kunne ikke lagre: '+error.message);return false;}
    const idx=attendance.findIndex(a=>a.gjest_id===gid&&a.konsert_id===kid);
    if(idx>=0)attendance[idx].status=status;else attendance.push({gjest_id:gid,konsert_id:kid,status});
  }
  return true;
}

function openAttendanceSheet(gid){
  attendanceGuestId=gid;
  const g=guests.find(x=>x.id===gid);
  document.getElementById('attendance-title').textContent='Konserter – '+(g?((g.fornavn||'')+' '+(g.etternavn||'')).trim()||'gjest':'gjest');
  renderAttendanceList();
  document.getElementById('attendance-sheet').classList.add('open');
}
function closeAttendanceSheet(){
  document.getElementById('attendance-sheet').classList.remove('open');
  attendanceGuestId=null;
}
function renderAttendanceList(){
  const list=document.getElementById('attendance-list');
  if(!concerts.length){
    list.innerHTML='<p class="konsert-empty">Ingen konserter lagt inn ennå. Trykk «+ Ny konsert» på oversikten for å legge til en.</p>';
    return;
  }
  const gid=attendanceGuestId;
  const sorted=concerts.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  list.innerHTML=sorted.map(k=>{
    const cur=statusFor(gid,k.id);
    return `<div class="attendance-row-wrap">
      <div class="attendance-row-head"><span class="an">${esc(k.navn)}${k.arkivert?' (arkivert)':''}</span><span class="ad">${k.dato?fmtDate(k.dato):''}</span></div>
      <div class="status-group">
        ${STATUS_KEYS.map(sk=>`<button class="status-btn ${cur===sk?'active s-'+sk:''}" onclick="pickStatus('${k.id}','${sk}')">${STATUS_META[sk].short}</button>`).join('')}
        ${cur?`<button class="status-btn clear" onclick="pickStatus('${k.id}',null)">✕</button>`:''}
      </div>
    </div>`;
  }).join('');
}
async function pickStatus(kid,status){
  const gid=attendanceGuestId;if(!gid)return;
  const ok=await setStatus(gid,kid,status);
  if(ok){render();renderAttendanceList();renderKonserter();renderArkiv();if(konsertDetailId===kid){renderKonsertDetailStats();renderKonsertDetailList();}}
}

function konsertCard(k){
  const c=statusCounts(k.id);
  return `<div class="konsert-card" onclick="openKonsertDetail('${k.id}')">
    <div class="konsert-card-top">
      <div>
        <div class="konsert-navn">${esc(k.navn)}</div>
        <div class="konsert-dato">${k.dato?fmtDateLong(k.dato):'Dato ikke satt'}</div>
      </div>
      <div class="card-btns" onclick="event.stopPropagation()">
        <button class="icon-btn" onclick="startEditKonsert('${k.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="icon-btn" onclick="deleteKonsert('${k.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      </div>
    </div>
    <div class="konsert-stats">${STATUS_KEYS.map(sk=>`<span class="kd-stat s-${sk}">${STATUS_META[sk].short} ${c[sk]}</span>`).join('')}</div>
  </div>`;
}
function renderKonserter(){
  const wrap=document.getElementById('konsert-list');if(!wrap)return;
  const active=activeConcertsSorted();
  wrap.innerHTML=active.length?active.map(konsertCard).join(''):'<p class="konsert-empty">Ingen konserter ennå. Trykk «+ Ny konsert» for å legge til.</p>';

function renderArkiv(){

function startEditKonsert(id){

  if(document.getElementById('konsert-detail-sheet').classList.contains('open'))closeKonsertDetail();
  editKonsertId=id;
  document.getElementById('konsert-edit-title').textContent='Rediger konsert';
  document.getElementById('k-navn').value=k.navn||'';
  document.getElementById('k-dato').value=k.dato||'';
  document.getElementById('konsert-edit-sheet').classList.add('open');
}
function closeKonsertEditSheet(){document.getElementById('konsert-edit-sheet').classList.remove('open');}
async function saveKonsert(){
  const btn=document.querySelector('#konsert-edit-actions .primary');
  const navnEl=document.getElementById('k-navn');
  const navn=navnEl?navnEl.value.trim():'';
  const datoEl=document.getElementById('k-dato');
  const dato=(datoEl&&datoEl.value)?datoEl.value:null;
  if(!navn){toast('Navn må fylles ut');return;}
  if(btn)btn.disabled=true;
  try{
    let error;
    if(editKonsertId){
      ({error}=await sb.from(KONSERT_TABLE).update({navn,dato}).eq('id',editKonsertId));
    }else{
      ({error}=await sb.from(KONSERT_TABLE).insert({navn,dato}));
    }
    if(error){toast('Kunne ikke lagre konsert: '+error.message);return;}
    toast(editKonsertId?'Lagret':'Konsert lagt til');
    closeKonsertEditSheet();
    await loadConcerts();
    if(konsertDetailId===editKonsertId){
      const k=concerts.find(x=>x.id===editKonsertId);
      if(k)document.getElementById('kd-title').textContent=k.navn+(k.dato?' · '+fmtDateLong(k.dato):'');
    }
  }catch(e){
    toast('Noe gikk galt: '+(e&&e.message?e.message:'ukjent feil'));
  }finally{
    if(btn)btn.disabled=false;
  }
}
async function deleteKonsert(id){
  const k=concerts.find(x=>x.id===id);
  if(!confirm(`Slette konserten "${k?k.navn:''}"? Dette fjerner også status-registreringen for denne konserten.`))return;
  const{error}=await sb.from(KONSERT_TABLE).delete().eq('id',id);
  if(error){toast('Kunne ikke slette: '+error.message);return;}
  toast('Slettet');
  if(konsertDetailId===id)closeKonsertDetail();
  await loadConcerts();await loadAttendance();render();renderKonserter();renderArkiv();
}

function openKonsertDetail(kid){
  konsertDetailId=kid;
  const k=concerts.find(x=>x.id===kid);if(!k)return;
  document.getElementById('kd-title').textContent=k.navn+(k.dato?' · '+fmtDateLong(k.dato):'');
  document.getElementById('kd-search').value='';
  document.getElementById('kd-archive-btn').textContent=k.arkivert?'Gjenåpne':'Arkiver';
  renderKonsertDetailStats();
  renderKonsertDetailList();
  document.getElementById('konsert-detail-sheet').classList.add('open');
}
function closeKonsertDetail(){
  document.getElementById('konsert-detail-sheet').classList.remove('open');
  konsertDetailId=null;
}
function renderKonsertDetailStats(){
  if(!konsertDetailId)return;
  const c=statusCounts(konsertDetailId);
  document.getElementById('kd-stats').innerHTML=STATUS_KEYS.map(sk=>`<span class="kd-stat s-${sk}">${STATUS_META[sk].short}: ${c[sk]}</span>`).join('');
}
function renderKonsertDetailList(){
  if(!konsertDetailId)return;
  const q=(document.getElementById('kd-search').value||'').toLowerCase();
  const kid=konsertDetailId;
  let list=guests;
  if(q)list=list.filter(g=>(g.fornavn||'').toLowerCase().includes(q)||(g.etternavn||'').toLowerCase().includes(q)||(g.phone||'').toLowerCase().includes(q));
  const statusMap=statusMapForKonsert(kid);
  document.getElementById('kd-list').innerHTML=list.length?list.map(g=>{
    const cur=statusMap.get(g.id)||null;
    return `<div class="attendance-row-wrap">
      <div class="attendance-row-head"><span class="an">${esc(g.fornavn||'')} ${esc(g.etternavn||'')}</span><span class="ad">${g.phone?esc(g.phone):''}</span></div>
      <div class="status-group">
        ${STATUS_KEYS.map(sk=>`<button class="status-btn ${cur===sk?'active s-'+sk:''}" onclick="setKdStatus('${g.id}','${sk}')">${STATUS_META[sk].short}</button>`).join('')}
        ${cur?`<button class="status-btn clear" onclick="setKdStatus('${g.id}',null)">✕</button>`:''}
      </div>
    </div>`;
  }).join(''):'<p class="konsert-empty">Ingen gjester funnet.</p>';
}
async function setKdStatus(gid,status){
  if(!konsertDetailId)return;
  const ok=await setStatus(gid,konsertDetailId,status);
  if(ok){renderKonsertDetailStats();renderKonsertDetailList();render();renderKonserter();renderArkiv();if(attendanceGuestId===gid)renderAttendanceList();}
}
async function toggleArchiveFromDetail(){
  const k=concerts.find(x=>x.id===konsertDetailId);if(!k)return;
  const newVal=!k.arkivert;
  const{error}=await sb.from(KONSERT_TABLE).update({arkivert:newVal}).eq('id',k.id);
  if(error){toast('Kunne ikke lagre: '+error.message);return;}
  k.arkivert=newVal;
  toast(newVal?'Konsert arkivert':'Konsert gjenåpnet');
  document.getElementById('kd-archive-btn').textContent=newVal?'Gjenåpne':'Arkiver';
  renderKonserter();renderArkiv();
}

function toggleSmsMode(){
  smsMode=!smsMode;
  smsSelected.clear();
  document.getElementById('sms-toggle-btn').textContent=smsMode?'✕ Avbryt valg':'✉️ Send SMS';
  document.getElementById('sms-bar-actions').style.display=smsMode?'flex':'none';
  document.getElementById('th-sms-check').style.display=smsMode?'':'none';
  if(smsMode)populateKonsertSelect();
  updateSmsCount();
  render();
}
function populateKonsertSelect(){
  const sel=document.getElementById('sms-konsert-select');if(!sel)return;
  const prev=sel.value;
  const active=activeConcertsSorted();
  sel.innerHTML='<option value="">— Velg konsert —</option>'+active.map(k=>`<option value="${k.id}">${esc(k.navn)}${k.dato?' · '+fmtDate(k.dato):''}</option>`).join('');
  if(prev&&active.some(k=>k.id===prev))sel.value=prev;
}
function selectedKonsertId(){
  const sel=document.getElementById('sms-konsert-select');
  return sel?sel.value:'';
}
function toggleSmsSelect(id,checked){
  if(checked)smsSelected.add(id);else smsSelected.delete(id);
  updateSmsCount();
}
function updateSmsCount(){
  const el=document.getElementById('sms-count');
  if(el)el.textContent=smsSelected.size+' valgt';
}
function selectAllVisible(){
  const list=getFilteredGuests();
  list.forEach(g=>{if(g.phone)smsSelected.add(g.id);});
  updateSmsCount();
  render();
}
function clearSmsSelection(){
  smsSelected.clear();
  updateSmsCount();
  render();
}

function openSmsTextSheet(){
  document.getElementById('sms-tekst-input').value=appSettings.sms_tekst||'';
  document.getElementById('sms-text-sheet').classList.add('open');
}
function closeSmsTextSheet(){document.getElementById('sms-text-sheet').classList.remove('open');}
async function saveSmsTekst(){
  const val=document.getElementById('sms-tekst-input').value.trim();
  if(!val){toast('Meldingen kan ikke være tom');return;}
  const{error}=await sb.from(SETTINGS_TABLE).upsert({id:1,sms_tekst:val,updated_at:new Date().toISOString()});
  if(error){toast('Kunne ikke lagre: '+error.message);return;}
  appSettings.sms_tekst=val;
  toast('Meldingstekst lagret');
  closeSmsTextSheet();
  render();
}

function startSmsQueue(){
  const kid=selectedKonsertId();
  if(!kid){toast('Velg hvilken konsert SMS-en gjelder for først');return;}
  const list=guests.filter(g=>smsSelected.has(g.id)&&g.phone);
  if(!list.length){toast('Ingen gjester med telefonnummer valgt');return;}
  smsQueue=list;
  smsQueueIndex=0;
  document.getElementById('sms-queue-sheet').classList.add('open');
  renderSmsQueueStep();
}
function renderSmsQueueStep(){
  const progressEl=document.getElementById('sms-queue-progress');
  const bodyEl=document.getElementById('sms-queue-body');
  const openBtn=document.getElementById('sms-open-btn');
  if(smsQueueIndex>=smsQueue.length){
    progressEl.textContent='Ferdig';
    bodyEl.innerHTML=`<div class="sms-done"><div class="sms-done-icon">♪</div><h3>Ferdig!</h3><p style="color:var(--muted);font-size:14px;margin-top:6px;">Alle valgte gjester er gått gjennom.</p></div>`;
    openBtn.style.display='none';
    return;
  }
  openBtn.style.display='';
  const g=smsQueue[smsQueueIndex];
  progressEl.textContent=`Gjest ${smsQueueIndex+1} av ${smsQueue.length}`;
  bodyEl.innerHTML=`<div class="sms-queue-guest">
    <div class="sms-queue-name">${esc(g.fornavn||'')} ${esc(g.etternavn||'')}</div>
    <div class="sms-queue-phone">📱 ${esc(g.phone||'')}</div>
    ${g.notater?`<div class="sms-queue-note">${esc(g.notater)}</div>`:''}
  </div>`;
}
function openSmsForQueueCurrent(){
  const g=smsQueue[smsQueueIndex];
  if(!g)return;
  window.location.href=smsHref(g.phone);
}
async function nextInSmsQueue(){
  const g=smsQueue[smsQueueIndex];
  if(g){
    const markEl=document.getElementById('sms-mark-invited');
    const kid=selectedKonsertId();
    if(markEl&&markEl.checked&&kid){
      await setStatus(g.id,kid,'invitert');
      render();renderKonserter();
    }
  }
  smsQueueIndex++;
  renderSmsQueueStep();
}
function closeSmsQueueSheet(){
  document.getElementById('sms-queue-sheet').classList.remove('open');
  smsQueue=[];smsQueueIndex=0;
}

async function sendAutoSms(){
  const kid=selectedKonsertId();
  if(!kid){toast('Velg hvilken konsert SMS-en gjelder for først');return;}
  const list=guests.filter(g=>smsSelected.has(g.id)&&g.phone);
  if(!list.length){toast('Ingen gjester med telefonnummer valgt');return;}
  if(!confirm(`Sende automatisk SMS til ${list.length} gjester via ClickSend, fra ditt verifiserte nummer?\n\nDette koster penger per melding og kan ikke angres.`))return;
  const btn=document.getElementById('sms-auto-btn');
  if(btn)btn.disabled=true;
  toast(`Sender til ${list.length} gjester…`);
  try{
    const{data,error}=await sb.functions.invoke('send-sms',{body:{
      recipients:list.map(g=>({id:g.id,phone:g.phone})),
      message:appSettings.sms_tekst
    }});
    if(error){
      let detail=error.message||'ukjent feil';
      try{
        if(error.context&&typeof error.context.json==='function'){
          const body=await error.context.json();
          if(body&&body.error)detail=body.error;
        }
      }catch(_e){}
      toast('Feil: '+detail,7000);
      return;
    }
    if(data&&data.error){toast('Feil: '+data.error,7000);return;}
    const okIds=(data.results||[]).filter(r=>r.status==='ok'&&r.id).map(r=>r.id);
    if(okIds.length){
      const{error:updErr}=await sb.from(DELTAKELSE_TABLE).upsert(okIds.map(id=>({gjest_id:id,konsert_id:kid,status:'invitert'})),{onConflict:'gjest_id,konsert_id'});
      if(updErr)toast('Sendt, men kunne ikke oppdatere status: '+updErr.message);
      await loadAttendance();
    }
    toast(`${data.sent} av ${data.total} sendt`);
    smsMode=false;smsSelected.clear();
    document.getElementById('sms-toggle-btn').textContent='✉️ Send SMS';
    document.getElementById('sms-bar-actions').style.display='none';
    document.getElementById('th-sms-check').style.display='none';
    render();renderKonserter();
  }catch(e){
    toast('Noe gikk galt: '+(e&&e.message?e.message:'ukjent feil'));
  }finally{
    if(btn)btn.disabled=false;
  }
}

let toastTimer=null;
function toast(msg,ms){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms||2200);
}
</script>
</body>
</html>
